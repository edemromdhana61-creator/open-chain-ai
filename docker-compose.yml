version: '3.8'

services:
  # API Server
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://openchain:openchain@db:5432/openchain
      - NATS_URL=nats://nats:4222
      - OLLAMA_HOST=https://api.ollama.com
      - OLLAMA_TOKEN=${OLLAMA_CLOUD_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - SANDBOX_CPU_LIMIT=1
      - SANDBOX_MEMORY_LIMIT=512m
      - CIRCUIT_BREAKER_MAX_REVISIONS=3
    depends_on:
      - db
      - nats
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - openchain

  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=openchain
      - POSTGRES_PASSWORD=openchain
      - POSTGRES_DB=openchain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - openchain

  # NATS Message Broker
  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-js -m 8222"
    networks:
      - openchain

  # React Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - openchain

volumes:
  postgres_data:

networks:
  openchain:
    driver: bridge
