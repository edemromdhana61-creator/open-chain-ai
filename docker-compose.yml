version: '3.8'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://openchain:openchain@db:5432/openchain
      - OLLAMA_HOST=http://host.docker.internal:11434
      - JWT_SECRET=change-this-in-production
      - SANDBOX_CPU_LIMIT=1
      - SANDBOX_MEMORY_LIMIT=512m
      - CIRCUIT_BREAKER_MAX_REVISIONS=3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - openchain

  db:
    image: ankane/pgvector:latest
    environment:
      - POSTGRES_USER=openchain
      - POSTGRES_PASSWORD=openchain
      - POSTGRES_DB=openchain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openchain"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - openchain

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - openchain

volumes:
  postgres_data:

networks:
  openchain:
    driver: bridge
